services:
  openletter:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      - APP_URL=${APP_URL:-http://localhost:3000}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-to-random-32-chars}
      # Email: set EMAIL_PROVIDER to resend, smtp, or console
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-console}
      # Resend
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      # SMTP
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
    restart: unless-stopped
