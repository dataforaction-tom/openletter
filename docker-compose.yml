services:
  openletter:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      - APP_URL=${APP_URL:-http://localhost:3000}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-to-random-32-chars}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
    restart: unless-stopped
